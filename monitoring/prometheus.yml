# prometheus.yml — настройки Prometheus (этап 6): откуда и как часто собирать
# метрики.
#
# Prometheus сам ходит к сервисам («scrape», соскоб): каждые 15 секунд
# открывает адрес /metrics, читает текущие значения и складывает их в свою
# базу временных рядов. Сервису достаточно отдавать текущие числа — историю
# хранит Prometheus. Посмотреть, кого он опрашивает и удачно ли:
# http://localhost:9090/targets

global:
  # Как часто опрашивать сервисы. 15 секунд — обычное значение: достаточно
  # часто для графиков и почти не нагружает сервис.
  scrape_interval: 15s

scrape_configs:
  # job_name — имя группы целей; попадает в метки как job="api".
  # targets — кого опрашивать: сервис api из compose.yaml по имени, порт 8000.
  # Адрес /metrics — значение по умолчанию, поэтому его не пишем.
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
