# ci.yml — автоматические проверки и сборка образа на GitHub Actions (этап 5).
#
# На каждый push в main и на каждый pull request GitHub берёт чистую виртуальную
# машину с Linux, скачивает код репозитория и проверяет его так же, как ты перед
# коммитом:
#   uv sync --locked → ruff check → ruff format --check → pytest (вместе с тестами базы)
# Если проверки прошли, вторая работа собирает Docker-образ проекта для двух
# процессоров (amd64 и arm64). Из main образ публикуется в GitHub Container
# Registry: ghcr.io/ayazsung/moex-vol. В pull request — только сборка, без публикации.
# Тег релиза (git tag v0.6.1) — выпуск версии: образ с тегами 0.6.1, 0.6 и latest
# и страница релиза на GitHub со списком изменений.
# Результат виден у коммита на GitHub: зелёная галочка или красный крестик.

# Имя workflow на вкладке Actions и в значке README.
name: CI

# Когда запускать:
#   push в main       — проверить то, что уже попало в основную ветку;
#   push тега v*      — выпуск версии: git tag v0.6.1 и git push origin v0.6.1 (часть 4);
#   pull_request      — проверить изменения до того, как их вольют в main (часть 3);
#   workflow_dispatch — кнопка «Run workflow» на вкладке Actions: запуск вручную.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Права ключа, который GitHub выдаёт каждому запуску: только читать код.
# Проверкам больше не нужно — минимум прав, как у пользователя app в образе.
# Работа image ниже просит себе ещё одно право — публиковать образы.
permissions:
  contents: read

# Адрес образа в GitHub Container Registry. Имя — только строчными буквами:
# реестр не принимает заглавные, поэтому не AyazSung, а ayazsung.
env:
  IMAGE: ghcr.io/ayazsung/moex-vol

jobs:
  # Одна работа (job) — все проверки по очереди на одной машине.
  checks:
    # Чистая машина GitHub с Ubuntu; после работы её уничтожат.
    runs-on: ubuntu-latest
    # Предохранитель: зависший запуск остановится через 15 минут, а не через 6 часов.
    timeout-minutes: 15

    # Сервисный контейнер — PostgreSQL рядом с машиной проверок, как db в compose.
    # Он нужен двум тестам из tests/test_db.py: без базы они пропускаются.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: moex
          POSTGRES_PASSWORD: moex
          POSTGRES_DB: moex
        # Порт базы на машине проверок: тесты ходят на localhost:5432.
        ports:
          - 5432:5432
        # Проверка здоровья, как healthcheck в compose: GitHub ждёт, пока база
        # начнёт принимать подключения, и только потом запускает шаги.
        options: >-
          --health-cmd "pg_isready -U moex -d moex"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Адрес базы для tests/test_db.py. Пароль учебный: база живёт только
    # во время запуска и снаружи недоступна.
    env:
      TEST_DATABASE_URL: postgresql://moex:moex@localhost:5432/moex

    steps:
      # Скачать код репозитория на машину проверок.
      - uses: actions/checkout@v7

      # Поставить uv той же версии, что на Mac, и включить кэш скачанных
      # библиотек: следующие запуски не качают их заново.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      # Окружение строго по uv.lock: --locked упадёт, если uv.lock устарел
      # относительно pyproject.toml. Python 3.13 uv поставит сам (.python-version).
      - name: Install dependencies
        run: uv sync --locked

      # Только для тега релиза: тег должен совпадать с версией в pyproject.toml,
      # v0.6.1 — 0.6.1. Иначе образ получил бы тег 0.6.1, а внутри была бы другая
      # версия. ::error:: — сообщение, которое GitHub покажет на странице запуска.
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest

  # Вторая работа — Docker-образ. Отдельная машина, отдельные права.
  image:
    # Только после успешных проверок: образ кода, который не прошёл тесты,
    # собирать и публиковать незачем.
    needs: checks
    runs-on: ubuntu-latest
    # Сборка под чужой процессор идёт через эмуляцию и дольше обычной.
    timeout-minutes: 30
    # packages: write — право публиковать образы в GitHub Container Registry.
    # Только этой работе: проверкам выше оно не нужно.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # QEMU — эмулятор процессоров: машина GitHub с amd64 сможет собрать
      # и вариант образа для arm64 (Mac на Apple Silicon).
      - uses: docker/setup-qemu-action@v4

      # Buildx — сборщик Docker, который умеет собирать образ сразу под несколько
      # процессоров и хранить кэш слоёв между запусками.
      - uses: docker/setup-buildx-action@v4

      # Вход в реестр ghcr.io ключом запуска GITHUB_TOKEN: свой пароль не нужен.
      # В pull request образ не публикуется, поэтому и вход не нужен.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Теги и метки образа по событию:
      #   type=ref,event=branch — из main: тег main (всегда последний образ main);
      #   type=ref,event=pr     — из pull request №7: тег pr-7;
      #   type=semver           — из тега релиза v0.6.1: теги 0.6.1 и 0.6, а ещё
      #                           latest (metadata-action добавляет его к релизам сам);
      #   type=sha              — тег по коммиту: sha-e466154, его не перезапишут.
      # Метки (labels) — сведения внутри образа: ссылка на репозиторий, коммит,
      # время сборки. По ссылке на репозиторий GitHub связывает образ с проектом.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Сборка по Dockerfile проекта для двух процессоров; из main — публикация.
      #   cache-from / cache-to — кэш слоёв в хранилище GitHub Actions: слой
      #   с библиотеками пересобирается, только когда меняется uv.lock.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Третья работа — страница релиза на GitHub. Только для тега релиза и только
  # после того, как образ версии опубликован.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write — право создавать релизы. Только этой работе.
    permissions:
      contents: write

    steps:
      # gh — программа GitHub для терминала, на машинах GitHub она уже стоит.
      #   --generate-notes — список изменений GitHub составит сам: pull request-ы,
      #                      влитые с прошлого релиза;
      #   --verify-tag     — не создавать релиз, если такого тега нет на GitHub.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
