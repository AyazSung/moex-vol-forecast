# compose.yaml — описание нескольких контейнеров, которые работают вместе.
# Постоянно работающие сервисы (база, сервер MLflow, API):
#   docker compose up -d db mlflow api
# Разовые задачи (профиль jobs):
#   docker compose run --rm loader             — загрузить свечи с биржи
#   docker compose run --rm loader import-candles — загрузить CSV в базу
#   docker compose run --rm predictor          — пакетный прогноз в базу
#
# Внутри compose все сервисы находятся в общей сети и находят друг друга по имени
# сервиса: к базе обращаются по адресу db:5432, к MLflow — mlflow:5000.
# Отступы в YAML важны: они показывают вложенность, как в Python.

services:
  # ---------- база данных PostgreSQL ----------
  db:
    # Официальный образ PostgreSQL 18.
    image: postgres:18
    # Переменные, по которым образ при первом запуске создаёт пользователя и базу.
    # Пароль прямо в файле допустим только для учебной базы на своём компьютере:
    # в проде пароли хранят в .env или в хранилище секретов, а не в Git.
    environment:
      POSTGRES_USER: moex
      POSTGRES_PASSWORD: moex
      POSTGRES_DB: moex
    # Проброс порта "порт_на_Mac:порт_в_контейнере": база доступна с Mac
    # по адресу localhost:5432 (например, для uv run и тестов).
    ports:
      - "5432:5432"
    # Данные базы хранятся в томе pgdata — он переживает удаление контейнера.
    # Для PostgreSQL 18 том подключают к /var/lib/postgresql.
    volumes:
      - pgdata:/var/lib/postgresql
    # Проверка здоровья: pg_isready отвечает, готова ли база принимать подключения.
    # Docker повторяет её каждые 2 секунды; статус виден в `docker compose ps`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moex -d moex"]
      interval: 2s
      timeout: 5s
      retries: 15

  # ---------- сервер MLflow: журнал экспериментов и реестр моделей ----------
  mlflow:
    # Образ проекта: в нём уже есть MLflow и драйвер PostgreSQL.
    image: moex-vol:0.5.0
    build: .
    # Команда вместо CMD образа — запустить сервер MLflow:
    #   --backend-store-uri     — где журнал: база mlflow в нашей PostgreSQL
    #                             (postgresql+psycopg — через драйвер psycopg);
    #   --artifacts-destination — куда класть файлы моделей: папка в томе;
    #                             клиенты отправляют и получают их через сам сервер;
    #   --allowed-hosts         — по каким адресам к серверу можно обращаться:
    #                             mlflow:5000 из контейнеров, localhost с любым
    #                             портом с Mac. Остальные адреса сервер отклонит
    #                             с ошибкой «Invalid Host header» — это защита
    #                             от подмены адреса (DNS rebinding).
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://moex:moex@db:5432/mlflow
      - --artifacts-destination=/app/mlartifacts
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*
    # Интерфейс MLflow на Mac: http://localhost:5001 (порт 5000 на Mac занят AirPlay).
    ports:
      - "5001:5000"
    # Файлы моделей — в томе mlartifacts: переживают удаление контейнера.
    volumes:
      - mlartifacts:/app/mlartifacts
    depends_on:
      db:
        condition: service_healthy
    # Сервер готов, когда отвечает на адрес /health. curl в образе нет, поэтому
    # проверяем маленькой программой на Python: ошибка соединения — код выхода 1.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- загрузчик свечей (разовая задача) ----------
  loader:
    image: moex-vol:0.5.0
    build: .
    # Настройки загрузчика (TICKER, FROM_DATE) — из файла .env проекта.
    env_file: .env
    # Адрес базы: хост db — это имя сервиса выше, а не localhost.
    # TZ — часовой пояс контейнера: время в логах — московское, как на бирже.
    # Без него в контейнере UTC (этап 1, часть 2).
    environment:
      DATABASE_URL: postgresql://moex:moex@db:5432/moex
      TZ: Europe/Moscow
    # Папка data проекта подключается внутрь, как -v в docker run.
    volumes:
      - ./data:/app/data
    # Запускать загрузчик только после того, как проверка здоровья базы прошла.
    depends_on:
      db:
        condition: service_healthy
    # Профиль jobs: `docker compose up` этот сервис не запускает сам;
    # его запускают явно — `docker compose run --rm loader`.
    profiles: ["jobs"]

  # ---------- пакетный прогноз (разовая задача) ----------
  predictor:
    image: moex-vol:0.5.0
    build: .
    command: ["predict-vol"]
    # Прогноз пишется в базу, модель-чемпион берётся с сервера MLflow.
    # TZ — «сегодня» по Москве. В UTC ночной запуск в 00:15 МСК попал бы ещё во
    # вчерашний день, и код отбросил бы только что закрытую свечу как незакрытую.
    environment:
      DATABASE_URL: postgresql://moex:moex@db:5432/moex
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TZ: Europe/Moscow
    # Признаки считаются по свечам из data/raw; CSV с прогнозом — в data/predictions.
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    profiles: ["jobs"]

  # ---------- API на FastAPI ----------
  api:
    image: moex-vol:0.5.0
    build: .
    # uvicorn — веб-сервер, который запускает приложение app из модуля api.
    # --host 0.0.0.0 — принимать запросы не только изнутри контейнера.
    command:
      - uvicorn
      - moex_vol_forecast.api:app
      - --host=0.0.0.0
      - --port=8000
    environment:
      DATABASE_URL: postgresql://moex:moex@db:5432/moex
      MLFLOW_TRACKING_URI: http://mlflow:5000
    # API на Mac: http://localhost:8000, документация — http://localhost:8000/docs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

# Именованные тома: Docker сам хранит их данные; удаляются только явно (down -v).
volumes:
  pgdata:
  mlartifacts:
