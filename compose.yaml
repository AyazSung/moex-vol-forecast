# compose.yaml — описание нескольких контейнеров, которые работают вместе.
# Постоянно работающие сервисы (база, сервер MLflow, API):
#   docker compose up -d db mlflow api
# Мониторинг (этап 6): Prometheus собирает метрики API, Grafana рисует дашборды
# и присылает оповещения в Telegram (настройки — в файле .env.alerts):
#   docker compose up -d prometheus grafana
# Разовые задачи (профиль jobs):
#   docker compose run --rm loader             — загрузить свечи с биржи
#   docker compose run --rm loader import-candles — загрузить CSV в базу
#   docker compose run --rm predictor          — пакетный прогноз в базу
#   docker compose run --rm trainer train-model --model har --register ...
#                                              — обучить модель-кандидата
#   docker compose run --rm trainer promote-model — сделать кандидата чемпионом,
#                                              если он лучше
#   docker compose run --rm predictor evaluate-forecasts — сверить прошлые
#                                              прогнозы с фактом (этап 6)
#   docker compose run --rm predictor backfill-forecasts — дописать прогнозы
#                                              чемпиона за его тестовый период
#   docker compose run --rm predictor check-drift — похожи ли свежие признаки
#                                              на данные обучения чемпиона
#
# Образ проекта собирает CI (GitHub Actions, этап 5) и публикует в реестре
# ghcr.io/ayazsung/moex-vol; здесь он не собирается, а скачивается. Выкатка
# новой версии: поменять тег у сервисов ниже на новый, затем
#   docker compose pull mlflow api && docker compose up -d mlflow api
#
# Внутри compose все сервисы находятся в общей сети и находят друг друга по имени
# сервиса: к базе обращаются по адресу db:5432, к MLflow — mlflow:5000.
# Отступы в YAML важны: они показывают вложенность, как в Python.

services:
  # ---------- база данных PostgreSQL ----------
  db:
    # Официальный образ PostgreSQL 18.
    image: postgres:18
    # Поднимать сервис снова, когда перезапустился Docker или Mac. Остановленный
    # руками (docker compose stop) сервис так и останется остановленным.
    restart: unless-stopped
    # Переменные, по которым образ при первом запуске создаёт пользователя и базу.
    # Пароль прямо в файле допустим только для учебной базы на своём компьютере:
    # в проде пароли хранят в .env или в хранилище секретов, а не в Git.
    environment:
      POSTGRES_USER: moex
      POSTGRES_PASSWORD: moex
      POSTGRES_DB: moex
    # Проброс порта "адрес:порт_на_Mac:порт_в_контейнере": база доступна с Mac
    # по адресу localhost:5432 (например, для uv run и тестов). 127.0.0.1 —
    # только с этого Mac: без него порт открыт всей сети Wi-Fi, а пароль учебный.
    ports:
      - "127.0.0.1:5432:5432"
    # Данные базы хранятся в томе pgdata — он переживает удаление контейнера.
    # Для PostgreSQL 18 том подключают к /var/lib/postgresql.
    volumes:
      - pgdata:/var/lib/postgresql
    # Проверка здоровья: pg_isready отвечает, готова ли база принимать подключения.
    # Docker повторяет её каждые 2 секунды; статус виден в `docker compose ps`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moex -d moex"]
      interval: 2s
      timeout: 5s
      retries: 15

  # ---------- сервер MLflow: журнал экспериментов и реестр моделей ----------
  mlflow:
    # Образ проекта: в нём уже есть MLflow и драйвер PostgreSQL.
    image: ghcr.io/ayazsung/moex-vol:0.10.0
    # Поднимать сервис снова, когда перезапустился Docker или Mac. Остановленный
    # руками (docker compose stop) сервис так и останется остановленным.
    restart: unless-stopped
    # Команда вместо CMD образа — запустить сервер MLflow:
    #   --backend-store-uri     — где журнал: база mlflow в нашей PostgreSQL
    #                             (postgresql+psycopg — через драйвер psycopg);
    #   --artifacts-destination — куда класть файлы моделей: папка в томе;
    #                             клиенты отправляют и получают их через сам сервер;
    #   --allowed-hosts         — по каким адресам к серверу можно обращаться:
    #                             mlflow:5000 из контейнеров, localhost с любым
    #                             портом с Mac. Остальные адреса сервер отклонит
    #                             с ошибкой «Invalid Host header» — это защита
    #                             от подмены адреса (DNS rebinding).
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://moex:moex@db:5432/mlflow
      - --artifacts-destination=/app/mlartifacts
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*
    # Интерфейс MLflow на Mac: http://localhost:5001 (порт 5000 на Mac занят AirPlay).
    # 127.0.0.1 — только с этого Mac: входа по паролю у MLflow нет, и из сети
    # кто угодно мог бы, например, перевесить чемпиона.
    ports:
      - "127.0.0.1:5001:5000"
    # Файлы моделей — в томе mlartifacts: переживают удаление контейнера.
    volumes:
      - mlartifacts:/app/mlartifacts
    depends_on:
      db:
        condition: service_healthy
    # Сервер готов, когда отвечает на адрес /health. curl в образе нет, поэтому
    # проверяем маленькой программой на Python: ошибка соединения — код выхода 1.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- загрузчик свечей (разовая задача) ----------
  loader:
    image: ghcr.io/ayazsung/moex-vol:0.10.0
    # Настройки загрузчика (TICKER, FROM_DATE) — из файла .env проекта.
    env_file: .env
    # Адрес базы: хост db — это имя сервиса выше, а не localhost.
    # TZ — часовой пояс контейнера: время в логах — московское, как на бирже.
    # Без него в контейнере UTC (этап 1, часть 2).
    environment:
      DATABASE_URL: postgresql://moex:moex@db:5432/moex
      TZ: Europe/Moscow
    # Папка data проекта подключается внутрь, как -v в docker run.
    volumes:
      - ./data:/app/data
    # Запускать загрузчик только после того, как проверка здоровья базы прошла.
    depends_on:
      db:
        condition: service_healthy
    # Профиль jobs: `docker compose up` этот сервис не запускает сам;
    # его запускают явно — `docker compose run --rm loader`.
    profiles: ["jobs"]

  # ---------- пакетный прогноз (разовая задача) ----------
  predictor:
    image: ghcr.io/ayazsung/moex-vol:0.10.0
    command: ["predict-vol"]
    # Прогноз пишется в базу, модель-чемпион берётся с сервера MLflow. Этот же
    # сервис запускает evaluate-forecasts, backfill-forecasts и check-drift
    # (этап 6): им нужны те же база и свечи, а дозаполнению и проверке дрейфа —
    # ещё и модели из MLflow.
    # TZ — «сегодня» по Москве. В UTC ночной запуск в 00:15 МСК попал бы ещё во
    # вчерашний день, и код отбросил бы только что закрытую свечу как незакрытую.
    environment:
      DATABASE_URL: postgresql://moex:moex@db:5432/moex
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TZ: Europe/Moscow
    # Признаки считаются по свечам из data/raw; CSV с прогнозом — в data/predictions.
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    profiles: ["jobs"]

  # ---------- обучение и выбор чемпиона (разовые задачи) ----------
  trainer:
    image: ghcr.io/ayazsung/moex-vol:0.10.0
    # Команда по умолчанию — обучение. Другую команду пишут при запуске, и она
    # заменяет эту целиком: docker compose run --rm trainer promote-model
    command: ["train-model"]
    # Модели и метрики — на сервер MLflow. TZ — «сегодня» по Москве: незакрытая
    # свеча сегодняшнего дня отбрасывается и при обучении (часть 2).
    # GIT_PYTHON_REFRESH=quiet — MLflow пытается записать коммит Git, из которого
    # запущено обучение, но программы git в образе нет. Без этой настройки на
    # каждый запуск — три длинных предупреждения об этом.
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TZ: Europe/Moscow
      GIT_PYTHON_REFRESH: quiet
    # Свечи из data/raw обучение только читает: :ro — «только для чтения»,
    # контейнер не сможет ничего в этой папке изменить.
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_healthy
    profiles: ["jobs"]

  # ---------- API на FastAPI ----------
  api:
    image: ghcr.io/ayazsung/moex-vol:0.10.0
    # Поднимать сервис снова, когда перезапустился Docker или Mac. Остановленный
    # руками (docker compose stop) сервис так и останется остановленным.
    restart: unless-stopped
    # uvicorn — веб-сервер, который запускает приложение app из модуля api.
    # --host 0.0.0.0 — принимать запросы не только изнутри контейнера.
    command:
      - uvicorn
      - moex_vol_forecast.api:app
      - --host=0.0.0.0
      - --port=8000
    # TZ — время в логах API московское, как у задач загрузки и прогноза.
    environment:
      DATABASE_URL: postgresql://moex:moex@db:5432/moex
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TZ: Europe/Moscow
    # API на Mac: http://localhost:8000, документация — http://localhost:8000/docs
    # 127.0.0.1 — только с этого Mac, как у базы и MLflow.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  # ---------- Prometheus: сбор метрик сервиса (этап 6) ----------
  prometheus:
    # Официальный образ. Версия зафиксирована, как у postgres: обновление —
    # отдельное решение, а не случайность.
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    # Команда — флаги программы prometheus:
    #   --config.file                — файл настроек: кого и как часто опрашивать;
    #   --storage.tsdb.path          — где хранить историю метрик: в томе;
    #   --storage.tsdb.retention.time — сколько хранить: 90 дней, потом старое
    #                                  удаляется само.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      # Файл настроек из репозитория; :ro — контейнер может только читать.
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # История метрик — в томе: переживает пересоздание контейнера.
      - prometheus_data:/prometheus
    # Интерфейс Prometheus: http://localhost:9090 — только с этого Mac.
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  # ---------- Grafana: дашборды и оповещения (этап 6) ----------
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    # Настройки Grafana — переменные GF_<РАЗДЕЛ>_<КЛЮЧ>:
    #   ANONYMOUS_ENABLED и ORG_ROLE — смотреть дашборды без входа, только
    #     просмотр (Viewer). Порт открыт только для этого Mac, поэтому можно;
    #   ADMIN_PASSWORD — пароль администратора admin, учебный, как у базы;
    #   DEFAULT_HOME_DASHBOARD_PATH — какой дашборд открывать на главной;
    #   ANALYTICS_* и NEWS_* — не отправлять статистику и не проверять
    #     обновления и новости в интернете.
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: moex
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/model.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    # Токен Telegram-бота и номер чата для оповещений. Файлы читаются по
    # порядку, и значения из следующего заменяют значения из предыдущего:
    #   alerts-defaults.env — заглушки из Git: без них Grafana с пустым токеном
    #                         не запустилась бы вовсе;
    #   .env.alerts         — настоящие токен и номер чата, файла нет в Git:
    #                         токен секретный. required: false — файла нет,
    #                         Grafana всё равно запустится, только оповещения
    #                         не будут доставлены.
    env_file:
      - monitoring/grafana/alerts-defaults.env
      - path: .env.alerts
        required: false
    volumes:
      # Настройки из файлов репозитория: источники данных, откуда брать
      # дашборды, правила оповещений и куда их слать.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Сами дашборды — файлы JSON из репозитория.
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Служебная база Grafana (пользователи, настройки) — в томе.
      - grafana_data:/var/lib/grafana
    # Интерфейс Grafana: http://localhost:3000 — только с этого Mac.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started

# Именованные тома: Docker сам хранит их данные; удаляются только явно (down -v).
volumes:
  pgdata:
  mlartifacts:
  prometheus_data:
  grafana_data:
