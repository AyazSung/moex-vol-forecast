[project]
name = "moex-vol-forecast"
version = "0.1.0"
description = "Daily volatility forecast for MOEX stocks"
readme = "README.md"
authors = [
    { name = "Ayaz Sunagatullin", email = "ayazsung@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[project.scripts]
fetch-candles = "moex_vol_forecast.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
